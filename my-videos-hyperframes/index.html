<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Toey Intro - HyperFrames</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "KanitLocal";
        src: url("assets/Kanit-Bold-Thai.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "KanitLocal";
        src: url("assets/Kanit-ExtraBold-Thai.woff2") format("woff2");
        font-weight: 800;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "KanitLocal", sans-serif;
        background: linear-gradient(135deg, #e754c9 0%, #7b4dff 45%, #34c6ff 100%);
        overflow: hidden;
      }

      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(2px);
        opacity: 0.85;
      }
      #blob-a {
        width: 340px;
        height: 340px;
        top: 0px;
        left: 70%;
        background: #ffe66d;
      }
      #blob-b {
        width: 220px;
        height: 220px;
        top: 70%;
        left: 5%;
        background: #ff6bcb;
      }
      #blob-c {
        width: 160px;
        height: 160px;
        top: 10%;
        left: 8%;
        background: #5ef2ff;
      }
      #blob-d {
        width: 120px;
        height: 120px;
        top: 78%;
        left: 82%;
        background: #a78bfa;
      }

      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 90px;
        padding: 0 120px;
      }

      #photo-wrap {
        position: relative;
        width: 480px;
        height: 480px;
        border-radius: 40px;
        padding: 14px;
        background: #ffffff;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
      }
      #photo-wrap img {
        width: 100%;
        height: 100%;
        border-radius: 28px;
        object-fit: cover;
        display: block;
      }
      #badge {
        position: absolute;
        bottom: -22px;
        right: -22px;
        background: #0f172a;
        color: #ffe66d;
        font-weight: 800;
        font-size: 30px;
        padding: 10px 22px;
        border-radius: 999px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
        white-space: nowrap;
      }

      #text-col {
        display: flex;
        flex-direction: column;
      }
      #name {
        color: #ffffff;
        font-size: 156px;
        font-weight: 800;
        letter-spacing: 1px;
        text-shadow: 0 8px 0 rgba(15, 23, 42, 0.35);
        transform-origin: left center;
      }
      #sub-wrap {
        margin-top: 8px;
        display: inline-flex;
      }
      #sub {
        color: #0f172a;
        background: #ffe66d;
        font-size: 48px;
        font-weight: 700;
        padding: 10px 28px;
        border-radius: 999px;
        box-shadow: 0 8px 0 rgba(15, 23, 42, 0.25);
      }
      #tagline {
        margin-top: 30px;
        color: #ffffff;
        font-size: 34px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="blob-a" class="blob"></div>
      <div id="blob-b" class="blob"></div>
      <div id="blob-c" class="blob"></div>
      <div id="blob-d" class="blob"></div>

      <section id="scene" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="photo-wrap">
          <img src="assets/toey.jpg" alt="toey" />
          <div id="badge">✦ SCI-COM ✦</div>
        </div>

        <div id="text-col">
          <div id="name">ตุ้ย</div>
          <div id="sub-wrap"><div id="sub">นักเรียนสายวิทย์-คอมพิวเตอร์ 💻</div></div>
          <div id="tagline">⚡ พร้อมลุยทุกความท้าทายสายเทค ⚡</div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#photo-wrap",
        { opacity: 0, scale: 0.4, rotate: -14 },
        { opacity: 1, scale: 1, rotate: -6, duration: 1.0, ease: "elastic.out(1, 0.6)" },
        0,
      );

      tl.fromTo(
        "#name",
        { opacity: 0, scale: 0.7, rotate: 4 },
        { opacity: 1, scale: 1, rotate: 0, duration: 0.9, ease: "elastic.out(1, 0.55)" },
        0.55,
      );

      tl.fromTo("#badge", { opacity: 0, scale: 0, rotate: -6 }, { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(2)" }, 2.15);

      tl.fromTo(
        "#sub-wrap",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.35,
      );

      tl.fromTo("#tagline", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.8);
      tl.to("#tagline", { opacity: 0, duration: 0.3 }, 4.6);

      tl.to("#blob-a", { x: 20, y: 24, duration: 5, ease: "sine.inOut" }, 0);
      tl.to("#blob-b", { x: -18, y: -20, duration: 5, ease: "sine.inOut" }, 0);
      tl.to("#blob-c", { x: 16, y: 18, duration: 5, ease: "sine.inOut" }, 0);
      tl.to("#blob-d", { x: -14, y: -16, duration: 5, ease: "sine.inOut" }, 0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
